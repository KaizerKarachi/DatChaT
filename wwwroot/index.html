<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>DatChaT</title>

    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="stylesheet" href="/css/responsive.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>

    <!-- === ЭКСКЛЮЗИВНЫЕ СТИЛИ ПИКЕРА СМАЙЛОВ === -->
    <style>
        .emoji-picker {
            position: fixed;
            bottom: 90px; /* Чуть выше поля ввода */
            right: 280px; /* Выравнивание по правому краю */
            width: 340px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); /* Для Safari на Mac */
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            z-index: 1000;
            animation: emojiSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes emojiSlideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .emoji-header {
            padding: 14px 18px;
            font-size: 13px;
            font-weight: 600;
            color: #4ade80;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            padding: 14px;
            max-height: 280px;
            overflow-y: auto;
        }

        .emoji-grid::-webkit-scrollbar { width: 6px; }
        .emoji-grid::-webkit-scrollbar-thumb {
            background: rgba(74, 222, 128, 0.4);
            border-radius: 3px;
        }

        .emoji-item {
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .emoji-item:hover {
            background: rgba(74, 222, 128, 0.2);
            transform: scale(1.25);
        }

        .emoji-item:active {
            transform: scale(0.9);
        }
    </style>
</head>

<body>

<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <h1>DatChaT</h1>
        <p class="subtitle">Семейный мессенджер</p>

        <input id="nicknameInput" type="text" placeholder="#никнейм" autocomplete="username">
        <input id="passwordInput" type="password" placeholder="Пароль" autocomplete="current-password">
        <button id="loginBtn">Войти</button>
    </div>
</div>

<div id="app" class="app hidden">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div>
                <div class="logo">DatChaT</div>
                <div class="online">Онлайн: <span id="userCount">0</span></div>
            </div>
            <button id="logoutBtn" class="header-btn">Выход</button>
        </div>
        <div id="usersList" class="users-list"></div>
    </aside>

    <main class="chat">
        <header class="chat-header">
            <div>
                <div class="chat-title">Семейный чат</div>
                <div class="chat-status">SignalR</div>
            </div>
            <div class="header-actions">
                <button id="themeBtn">🌙</button>
                <button id="searchBtn">🔍</button>
            </div>
        </header>

        <div id="pinnedContainer" class="pinned hidden">
            <span>📌</span>
            <span id="pinnedText"></span>
        </div>

        <section id="messages" class="messages"></section>

        <footer class="composer">
            <button id="attachBtn">📎</button>
            <input id="messageInput" placeholder="Введите сообщение...">
            <button id="emojiBtn">😊</button>
            <button id="sendBtn">➜</button>
        </footer>
    </main>
</div>

<!-- HTML-контейнер для пикера смайлов -->
<div id="emojiPicker" class="emoji-picker">

</div>

<script src="/js/app.js?v=2"></script>
