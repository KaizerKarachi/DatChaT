<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DatChaT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: linear-gradient(180deg, #87CEEB, #7BC67E); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 800px; height: 90vh; background: rgba(255, 255, 255, 0.95); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .header { padding: 15px; background: linear-gradient(135deg, #4d79ff, #7b5cff); color: white; display: flex; justify-content: space-between; align-items: center; }
        .login-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; }
        .login-screen input { padding: 12px; width: 250px; border-radius: 8px; border: 1px solid #ccc; }
        .login-screen button { padding: 12px 30px; background: #4a7c2e; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .main { flex: 1; display: none; flex-direction: column; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 15px; border-radius: 12px; animation: fadeIn 0.3s ease; word-wrap: break-word; }
        .message.left { align-self: flex-start; background: #e6f4fa; border-bottom: 2px solid #2d5016; }
        .message.right { align-self: flex-end; background: linear-gradient(135deg, #5b7cfa, #7a5af8); color: white; }
        .message .user { font-size: 11px; opacity: 0.8; margin-bottom: 4px; font-weight: bold; }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; }
        .message a { color: inherit; text-decoration: underline; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .input-area { padding: 15px; display: flex; gap: 10px; background: rgba(255,255,255,0.8); border-top: 1px solid #ddd; }
        .message-input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #ccc; outline: none; font-size: 16px; }
        .send-btn, .attach-btn { width: 45px; height: 45px; border-radius: 50%; border: none; cursor: pointer; font-size: 20px; transition: transform 0.1s; display: flex; align-items: center; justify-content: center; }
        .send-btn { background: #5b7cfa; color: white; }
        .attach-btn { background: #e0e0e0; color: #333; }
        .send-btn:active, .attach-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="/images/logo.svg" alt="DatChaT Logo" style="height: 36px; width: auto;">
            <button onclick="hardReset()" style="background:none; border:1px solid white; color:white; padding:5px 10px; border-radius:8px; cursor:pointer;">🔄 Сброс</button>
        </div>
        <div class="login-screen" id="loginScreen">
            <h3>Вход в чат</h3>
            <input type="text" id="nicknameInput" placeholder="#твой ник">
            <input type="password" id="passwordInput" placeholder="Пароль">
            <button onclick="joinChat()">Войти</button>
        </div>
        <div class="main" id="mainContent">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="file" id="fileInput" style="display: none;" onchange="uploadFile(this.files[0])">
                <input type="text" class="message-input" id="messageInput" placeholder="Сообщение...">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
    <script>
        const connection = new signalR.HubConnectionBuilder().withUrl("/chat").withAutomaticReconnect().build();
        let loginSuccess = false;
        let currentNickname = '';

        connection.on("ReceiveMessage", (msg) => {
            const div = document.createElement('div');
            const userName = msg.nickname || msg.Nickname || msg.User || 'Неизвестный';
            const text = msg.text || msg.Text || '';
            const fileUrl = msg.fileUrl || msg.FileUrl || '';
            const fileType = msg.fileType || msg.FileType || '';
            const isMe = userName === currentNickname;
            
            div.className = 'message ' + (isMe ? 'right' : 'left');
            let contentHtml = '<div class="user">' + userName + '</div>';
            if (fileUrl) {
                if (fileType === 'image') contentHtml += '<img src="' + fileUrl + '" onclick="window.open(this.src)">';
                else contentHtml += '<a href="' + fileUrl + '" target="_blank">📎 ' + (text || 'Файл') + '</a><br>';
            }
            contentHtml += '<div>' + text + '</div>'; // ИСПРАВЛЕНА ОППЕЧАТКА ЗДЕСЬ
            div.innerHTML = contentHtml;
            
            const messagesDiv = document.getElementById('messages');
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        async function joinChat() {
            let nick = document.getElementById('nicknameInput').value.trim();
            let pass = document.getElementById('passwordInput').value.trim();
            if (!nick || !pass) { alert("Введите ник и пароль!"); return; }
            if (!nick.startsWith('#')) nick = '#' + nick;
            currentNickname = nick;
            
            try {
                await connection.start();
                const result = await connection.invoke("RegisterOrLogin", nick, pass);
                
                localStorage.setItem('familyChatToken', result.sessionToken || result.SessionToken);
                const savedNick = result.nickname || result.Nickname;
                localStorage.setItem('familyChatNickname', savedNick.startsWith('#') ? savedNick : '#' + savedNick);
                
                loginSuccess = true;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'flex';
            } catch (err) {
                alert("Ошибка входа: " + err);
            }
        }

        async function sendMessage() {
            if (!loginSuccess) return;
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text) {
                await connection.invoke("SendMessage", text, "", "");
                input.value = '';
            }
        }

        async function uploadFile(file) {
            if (!file || !loginSuccess) return;
            const formData = new FormData();
            formData.append("file", file);
            
            try {
                const response = await fetch("/upload", { method: "POST", body: formData });
                if (response.ok) {
                    const data = await response.json();
                    try {
                        await connection.invoke("SendFile", file.name, data.fileUrl, data.fileType);
                    } catch (e) {
                        await connection.invoke("SendMessage", file.name, data.fileUrl, data.fileType);
                    }
                } else {
                    alert("Ошибка загрузки файла");
                }
            } catch (err) {
                console.error("Ошибка загрузки:", err);
                alert("Не удалось загрузить файл");
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function hardReset() {
            localStorage.clear();
            location.reload();
        }

        window.addEventListener('load', async () => {
            const nick = localStorage.getItem('familyChatNickname');
            const token = localStorage.getItem('familyChatToken');
            if (nick && token) {
                currentNickname = nick;
                try {
                    await connection.start();
                    await connection.invoke("JoinByToken", nick, token);
                    loginSuccess = true;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'flex';
                } catch (err) {
                    localStorage.clear(); // Автоматическая очистка плохого токена
                }
            }
        });
    </script>
</body>
</html>
